name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test:
    # Pinned, not ubuntu-latest: the golden tests in test/goldens/ are Linux pixel
    # output, so a runner image change can break them. ubuntu-latest migrates to
    # Ubuntu 26 from 2026-10-19. Regenerate the goldens before bumping this.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Validate package
        run: flutter pub publish --dry-run
